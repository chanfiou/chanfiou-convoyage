name: Déploiement Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: 61d7126040cd4feba9a50417249b3631

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node build.mjs

      - name: Déployer le frontend (Cloudflare Pages)
        run: npx wrangler pages deploy dist --project-name chanfiou-convoyage --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Déployer l’API (Cloudflare Worker)
        run: npx wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Purger le cache CDN
        run: |
          reponse=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/5f6479adec5e665894c1199ebc626a8d/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$reponse" | grep -q '"success":true'; then
            echo "Cache CDN purgé."
          else
            echo "::warning::Purge du cache refusée (ajouter la permission Zone > Cache Purge au jeton) : $reponse"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
